<!doctype html><html lang="zh-Hant"><meta charset="utf-8">
<style>
body{margin:0;font:13px system-ui;color:#203331;background:#f5f8f9}#toolbar{display:flex;gap:8px;padding:10px;align-items:center}
button{border:1px solid #b9c9ce;background:white;border-radius:6px;padding:5px 12px;cursor:pointer}
svg{width:100%;height:490px;touch-action:none;cursor:grab;background:radial-gradient(#d1dde1 1px,transparent 1px);background-size:18px 18px}
.node{cursor:pointer}.node:focus rect{stroke:#152b44;stroke-width:4px}.edge{cursor:pointer}.edge text{paint-order:stroke;stroke:#f5f8f9;stroke-width:4px;stroke-linejoin:round;fill:#49565f;font-size:10px}
#hint{padding:8px 12px;min-height:20px} .legend{font-size:11px;padding:0 12px 8px;color:#586870}
</style>
<div id="toolbar"><button id="zin" aria-label="Zoom in">＋</button><button id="zout" aria-label="Zoom out">－</button><button id="reset">重設視圖 / Reset view</button><span>拖曳背景平移 · 滾輪縮放 · 點節點或連線查看證據</span></div>
<svg id="graph" role="application" aria-label="Interactive persisted Memory Graph"><g id="scene"></g></svg>
<div id="hint" aria-live="polite">選擇一個節點</div>
<div class="legend">藍：觀察　紫：未授權候選　黃：候選區域／位置　綠：已授權身分　紅：REJECTED　虛線：候選或原始紀錄引用。連線不代表連續存在或物理接觸。</div>
<script>
const svg=document.querySelector('svg'),scene=document.querySelector('#scene'),NS='http://www.w3.org/2000/svg';
let data={nodes:[],edges:[]},token='',selected='',edgeSelected='',zoom=1,tx=20,ty=20,drag=null,positions=new Map();
const send=(type,extra={})=>window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
const el=(name,attrs={},text='')=>{const x=document.createElementNS(NS,name);for(const [k,v] of Object.entries(attrs))x.setAttribute(k,v);if(text)x.textContent=text;return x;};
function transform(){scene.setAttribute('transform',`translate(${tx},${ty}) scale(${zoom})`);}
function reset(){zoom=1;tx=20;ty=20;transform();}
function emit(value){send('streamlit:setComponentValue',{value:{...value,view_token:token,nonce:Date.now()},dataType:'json'});}
function paint(){
 scene.replaceChildren();positions.clear();const columns=['Candidate','Identity','Observation','SpatialEvidence','Region','Event'].filter(k=>data.nodes.some(n=>n.kind===k));
 const cols=columns.map(k=>data.nodes.filter(n=>n.kind===k));const width=svg.clientWidth||1000;
 cols.forEach((ns,i)=>ns.forEach((n,j)=>positions.set(n.id,{x:i*Math.max(155,(width-60)/Math.max(1,columns.length)),y:j*62+20})));
 const connected=new Set([selected]);for(const e of data.edges)if(e.source===selected||e.target===selected){connected.add(e.source);connected.add(e.target);}
 for(const e of data.edges){const a=positions.get(e.source),b=positions.get(e.target);if(!a||!b)continue;
   const active=e.id===edgeSelected||e.source===selected||e.target===selected;const group=el('g',{class:'edge','data-edge-id':e.id,tabindex:0,role:'button','aria-label':e.predicate});
   const points={x1:a.x+70,y1:a.y+20,x2:b.x+70,y2:b.y+20};
   group.append(el('line',{...points,stroke:'transparent','stroke-width':18}));
   group.append(el('line',{...points,stroke:active?'#157d83':'#b7c4ce','stroke-width':active?3:1.3,'stroke-dasharray':e.status==='VERIFIED'?'':'5 4'}));
   if(active)group.append(el('text',{x:(a.x+b.x)/2+65,y:(a.y+b.y)/2+15},e.predicate));
   const click=()=>{edgeSelected=e.id;document.querySelector('#hint').textContent=e.predicate+' · '+e.status;emit({edge_id:e.id});paint();};
   group.onclick=click;group.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();click();}};scene.append(group);
 }
 const colors={Candidate:'#e2d9f6',Identity:'#c4e8d5',Observation:'#cde4f6',Region:'#f5e4af',SpatialEvidence:'#ffe9c7',Event:'#f1dfbd'};
 for(const n of data.nodes){const p=positions.get(n.id),active=n.id===selected,focus=(data.focus||[]).includes(n.id);
   const group=el('g',{class:'node','data-node-id':n.id,transform:`translate(${p.x},${p.y})`,tabindex:0,role:'button','aria-label':n.label});
   const color=n.status==='REJECTED'?'#f2cdcd':colors[n.kind];
   group.setAttribute('opacity',selected&&!connected.has(n.id)?.42:1);
   group.append(el('rect',{width:140,height:42,rx:9,fill:color,stroke:active?'#147e85':focus?'#7d5bb0':'#9eafb9','stroke-width':active?3:focus?2:1,'stroke-dasharray':n.status==='VERIFIED'||n.kind==='Identity'?'':'4 2'}));
   group.append(el('title',{},n.label+'\n'+n.kind+' · '+n.status+'\n'+n.record_id));
   group.append(el('text',{x:7,y:15,'font-size':10,fill:'#384556'},n.kind+' · '+n.status));
   group.append(el('text',{x:7,y:32,'font-size':11,fill:'#1e3044'},n.label.length>21?n.label.slice(0,20)+'…':n.label));
   const click=()=>{selected=n.id;edgeSelected='';document.querySelector('#hint').textContent=n.label+' · '+n.status;emit({node_id:n.id});paint();};
   group.onclick=click;group.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();click();}};scene.append(group);
 } transform();
}
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node,.edge'))return;drag={x:e.clientX-tx,y:e.clientY-ty};svg.setPointerCapture(e.pointerId);});
svg.addEventListener('pointermove',e=>{if(drag){tx=e.clientX-drag.x;ty=e.clientY-drag.y;transform();}});svg.addEventListener('pointerup',()=>drag=null);
function scale(f){zoom=Math.max(.15,Math.min(4,zoom*f));transform();}
svg.addEventListener('wheel',e=>{e.preventDefault();scale(e.deltaY<0?1.12:1/1.12);},{passive:false});
document.querySelector('#zin').onclick=()=>scale(1.2);document.querySelector('#zout').onclick=()=>scale(1/1.2);document.querySelector('#reset').onclick=reset;
window.addEventListener('message',e=>{if(e.source!==window.parent||e.data.type!=='streamlit:render')return;const a=e.data.args;
 if(token!==a.view_token){reset();token=a.view_token;edgeSelected='';}data=a.graph;selected=a.selected||'';paint();send('streamlit:setFrameHeight',{height:595});});
send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:595});
</script></html>

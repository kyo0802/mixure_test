[project]
name = "relative-memory-graph"
version = "0.1.0"
description = "RGB-only R4DSG-inspired temporal memory graph prototype"
requires-python = ">=3.12,<3.13"
dependencies = ["ultralytics>=8.3,<9", "opencv-python>=4.10,<5", "numpy>=1.26,<3", "torch>=2.5,<3", "networkx>=3.3,<4", "matplotlib>=3.9,<4", "pydantic>=2.9,<3", "scipy>=1.14,<2", "PyYAML>=6,<7", "lap>=0.5.12,<0.6"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[project.optional-dependencies]
vlm = ["transformers>=4.57,<5", "Pillow>=12,<13", "huggingface-hub>=0.34,<1", "psutil>=5.9,<8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_graph"]

[tool.uv]
cache-dir = ".uv-cache"

[tool.pytest.ini_options]
testpaths = ["tests"]
